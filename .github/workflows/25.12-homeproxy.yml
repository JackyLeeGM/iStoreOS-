name: Build 25.12 HomeProxy

on:
  schedule:
    - cron: "0 22 * * *"  # 北京时间早上 6 点
  workflow_dispatch:

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 安装构建依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself curl tar gawk

      - name: 🚀 检索并下载 25.12 APK 依赖包
        run: |
          MIRRORS=(
            "https://downloads.immortalwrt.org/snapshots/packages"
            "https://mirrors.pku.edu.cn/immortalwrt/snapshots/packages"
          )

          declare -A PLATFORMS=(
            ["x86_64"]="x86_64"
            ["aarch64_generic"]="aarch64_generic"
            ["aarch64_cortex-a53"]="aarch64_cortex-a53"
          )

          TMP_DIR="$(mktemp -d)"
          COMMON_TMP="${TMP_DIR}/common_apks"
          mkdir -p "$COMMON_TMP"

          download_apk_multisource() {
            subpaths=("$1")
            keyword="$2"
            save_dir="$3"
            
            # 如果没传备用路径，自动添加补全
            if [ "$1" = "luci" ]; then
              subpaths=("luci" "all/luci" "x86_64/luci")
            elif [ "$1" = "packages" ]; then
              subpaths=("packages" "x86_64/packages")
            fi

            success=0

            for subpath in "${subpaths[@]}"; do
              for base_url in "${MIRRORS[@]}"; do
                repo_url="${base_url}/${subpath}"
                hash_id=$(echo "$repo_url" | md5sum | awk '{print $1}')
                index_tar="${TMP_DIR}/APKINDEX_${hash_id}.tar.gz"
                extract_dir="${TMP_DIR}/ext_${hash_id}"
                mkdir -p "$extract_dir"

                echo "🔍 正在从 ${repo_url} 查找 $keyword ..."

                if curl -fsL --connect-timeout 8 --retry 2 "${repo_url}/APKINDEX.tar.gz" -o "$index_tar" 2>/dev/null; then
                  if tar -zxf "$index_tar" -C "$extract_dir" 2>/dev/null; then
                    FILE=$(tr -d '\r' < "$extract_dir/APKINDEX" | awk -v kw="$keyword" '
                      BEGIN { RS=""; FS="\n" }
                      {
                        pkg=""; ver=""
                        for(i=1;i<=NF;i++) {
                          if($i ~ /^P:/) pkg=substr($i,3)
                          if($i ~ /^V:/) ver=substr($i,3)
                        }
                        if(pkg == kw && ver != "") {
                          print pkg "-" ver ".apk"
                          exit
                        }
                      }
                    ')

                    if [ -n "$FILE" ]; then
                      echo "⬇️ 找到匹配，正在下载: $FILE"
                      if curl -fsL --connect-timeout 15 "${repo_url}/${FILE}" -o "${save_dir}/${FILE}"; then
                        if [[ "$FILE" == *"~"* ]]; then
                          NEW_FILE=$(echo "$FILE" | tr '~' '-')
                          mv "${save_dir}/${FILE}" "${save_dir}/${NEW_FILE}"
                        fi
                        success=1
                        break 2
                      fi
                    fi
                  fi
                fi
              done
            done

            if [ $success -eq 1 ]; then
              return 0
            else
              echo "❌ 无法找到或下载: $keyword"
              return 1
            fi
          }

          echo "📦 [1/2] 下载 luci-app-homeproxy 及语言包..."
          download_apk_multisource "luci" "luci-app-homeproxy" "$COMMON_TMP"
          download_apk_multisource "luci" "luci-i18n-homeproxy-zh-cn" "$COMMON_TMP"

          echo "📦 [2/2] 分平台下载 sing-box 并构建安装包目录..."
          for platform in "${!PLATFORMS[@]}"; do
            arch_path="${PLATFORMS[$platform]}"
            SAVE_DIR="$(pwd)/${platform}"
            mkdir -p "$SAVE_DIR"

            # 复制通用界面包
            cp -f "$COMMON_TMP"/*.apk "$SAVE_DIR/"

            # 自动生成适应 25.12 apk 的 install.sh
            cat << 'EOF' > "${SAVE_DIR}/install.sh"
#!/bin/sh
set -e
echo "🚀 开始安装 HomeProxy (APK 格式)..."
apk update || true
apk add --allow-untrusted *.apk
echo "✅ HomeProxy 安装成功！"
EOF
            chmod +x "${SAVE_DIR}/install.sh"

            # 下载对应架构的 sing-box
            download_apk_multisource "${arch_path}/packages" "sing-box" "$SAVE_DIR"
          done

          rm -rf "$TMP_DIR"
          echo "✅ 所有平台依赖获取完毕！"

      - name: 🔍 提取版本号并打包
        id: pack
        run: |
          mkdir -p output

          APP_APK=""
          for PLAT in x86_64 aarch64_generic aarch64_cortex-a53; do
            MATCH=$(ls ${PLAT}/luci-app-homeproxy-*.apk 2>/dev/null | head -n 1 || true)
            if [ -n "$MATCH" ]; then
              APP_APK="$MATCH"
              break
            fi
          done

          if [ -z "$APP_APK" ]; then
            echo "❌ 未找到下载的 apk 文件，请检查上一步下载日志！"
            ls -R
            exit 1
          fi

          VERSION=$(basename "$APP_APK" | sed -n 's/^luci-app-homeproxy-\(.*\)\.apk$/\1/p')

          if [ -z "$VERSION" ]; then
            echo "❌ 无法提取版本号"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "提取到的版本号: $VERSION"

          for PLATFORM in x86_64 aarch64_generic aarch64_cortex-a53; do
            makeself "$PLATFORM" "output/25.12-homeproxy-${PLATFORM}-${VERSION}.run" \
              "homeproxy ${PLATFORM} Installer v${VERSION}" ./install.sh
          done

      - name: 获取当天日期 Tag
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: 发布 Release 资产
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build 25.12 - ${{ env.tag_name }}"
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
