name: Build 25.12 HomeProxy

on:
  schedule:
    - cron: "0 22 * * *"  # 北京时间早上 6 点
  workflow_dispatch:

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 📦 安装 makeself 工具
        run: sudo apt-get update && sudo apt-get install -y makeself curl

      - name: 🚀 下载 homeproxy 的所有 apk
        run: |
          chmod +x shell/hp25.sh
          ./shell/hp25.sh

      - name: 📋 拷贝 install.sh 到各平台目录
        run: |
          chmod +x shell/install.sh
          cp shell/install.sh x86_64/install.sh
          cp shell/install.sh aarch64_generic/install.sh
          cp shell/install.sh aarch64_cortex-a53/install.sh

      - name: 🔍 提取版本号并打包
        id: pack
        run: |
          mkdir -p output

          # 获取 APK 版本号
          APP_APK=$(ls aarch64_generic/luci-app-homeproxy-*.apk 2>/dev/null | head -n 1 || true)
          if [ -z "$APP_APK" ]; then
            echo "❌ 未找到下载的 apk 文件"
            exit 1
          fi

          VERSION=$(basename "$APP_APK" | sed -n 's/^luci-app-homeproxy-\(.*\)\.apk$/\1/p')

          if [ -z "$VERSION" ]; then
            echo "❌ 无法提取版本号"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "提取到的版本号: $VERSION"

          # 打包各个平台为 .run 文件
          for PLATFORM in x86_64 aarch64_generic aarch64_cortex-a53; do
            makeself "$PLATFORM" "output/25.12-homeproxy-${PLATFORM}-${VERSION}.run" \
              "homeproxy ${PLATFORM} Installer v${VERSION}" ./install.sh
          done

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build 25.12 - ${{ env.tag_name }}"
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
