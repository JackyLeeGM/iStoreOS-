name: Build 25.12 HomeProxy

on:
  schedule:
    - cron: "0 22 * * *"  # 北京时间早上 6 点
  workflow_dispatch:

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 安装构建依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself curl tar gawk

      - name: 🚀 检索并下载 25.12 APK 依赖包
        run: |
          MIRROR_BASE_URLS=(
            "https://downloads.immortalwrt.org/snapshots/packages"
            "https://downloads.immortalwrt.org/releases/packages-25.12"
            "https://mirrors.pku.edu.cn/immortalwrt/snapshots/packages"
            "https://mirrors.pku.edu.cn/immortalwrt/releases/packages-25.12"
          )

          PLATFORMS=("x86_64" "aarch64_generic" "aarch64_cortex-a53")

          TMP_DIR="$(mktemp -d)"

          download_apk_multisource() {
            local arch="$1"
            local subpkg="$2"
            local keyword="$3"
            local save_dir="$4"

            local success=0

            for base in "${MIRROR_BASE_URLS[@]}"; do
              local repo_url="${base}/${arch}/${subpkg}"
              local hash_id=$(echo -n "$repo_url" | md5sum | awk '{print $1}')
              local index_tar="${TMP_DIR}/APKINDEX_${hash_id}.tar.gz"
              local extract_dir="${TMP_DIR}/ext_${hash_id}"
              mkdir -p "$extract_dir"

              echo "🔍 正在检索 [${arch}/${subpkg}] -> ${repo_url}"

              if curl -fsL --connect-timeout 8 --retry 2 "${repo_url}/APKINDEX.tar.gz" -o "$index_tar" 2>/dev/null; then
                if tar -zxf "$index_tar" -C "$extract_dir" 2>/dev/null; then
                  # 兼容处理 APKINDEX 与 APKINDEX.unsigned 文件名
                  local index_file=""
                  if [ -f "$extract_dir/APKINDEX.unsigned" ]; then
                    index_file="$extract_dir/APKINDEX.unsigned"
                  elif [ -f "$extract_dir/APKINDEX" ]; then
                    index_file="$extract_dir/APKINDEX"
                  fi

                  if [ -n "$index_file" ]; then
                    local file_name
                    file_name=$(tr -d '\r' < "$index_file" | awk -v kw="$keyword" '
                      BEGIN { RS=""; FS="\n" }
                      {
                        pkg=""; ver=""
                        for(i=1;i<=NF;i++) {
                          if($i ~ /^P:/) pkg=substr($i,3)
                          if($i ~ /^V:/) ver=substr($i,3)
                        }
                        if(pkg == kw && ver != "") {
                          print pkg "-" ver ".apk"
                          exit
                        }
                      }
                    ')

                    if [ -n "$file_name" ]; then
                      echo "⬇️ 找到匹配: ${file_name}，正在下载..."
                      if curl -fsL --connect-timeout 15 "${repo_url}/${file_name}" -o "${save_dir}/${file_name}"; then
                        if [[ "$file_name" == *"~"* ]]; then
                          local new_file
                          new_file=$(echo "$file_name" | tr '~' '-')
                          mv "${save_dir}/${file_name}" "${save_dir}/${new_file}"
                        fi
                        success=1
                        break
                      fi
                    fi
                  fi
                fi
              fi
            done

            if [ $success -eq 1 ]; then
              return 0
            else
              echo "❌ 无法找到或下载: [${arch}] ${keyword}"
              return 1
            fi
          }

          for platform in "${PLATFORMS[@]}"; do
            echo "=========================================="
            echo "📦 正在处理平台架构: ${platform}"
            echo "=========================================="

            SAVE_DIR="$(pwd)/${platform}"
            mkdir -p "$SAVE_DIR"

            download_apk_multisource "$platform" "luci" "luci-app-homeproxy" "$SAVE_DIR"
            download_apk_multisource "$platform" "luci" "luci-i18n-homeproxy-zh-cn" "$SAVE_DIR"
            download_apk_multisource "$platform" "packages" "sing-box" "$SAVE_DIR"

            # 写入标准的 install.sh（顶格无缩进，防止 EOF 解析异常）
            cat << 'EOF' > "${SAVE_DIR}/install.sh"
            #!/bin/sh
            set -e
            echo "🚀 开始安装 HomeProxy (APK 格式)..."
            apk update || true
            apk add --allow-untrusted *.apk
            echo "✅ HomeProxy 安装成功！"
            EOF
            chmod +x "${SAVE_DIR}/install.sh"
          done

          rm -rf "$TMP_DIR"
          echo "✅ 所有架构依赖包获取完毕！"

      - name: 🔍 提取版本号并打包
        id: pack
        run: |
          mkdir -p output

          APP_APK=""
          for PLAT in x86_64 aarch64_generic aarch64_cortex-a53; do
            MATCH=$(ls ${PLAT}/luci-app-homeproxy-*.apk 2>/dev/null | head -n 1 || true)
            if [ -n "$MATCH" ]; then
              APP_APK="$MATCH"
              break
            fi
          done

          if [ -z "$APP_APK" ]; then
            echo "❌ 未找到下载的 apk 文件，请检查上一步下载日志！"
            ls -R
            exit 1
          fi

          VERSION=$(basename "$APP_APK" | sed -n 's/^luci-app-homeproxy-\(.*\)\.apk$/\1/p')

          if [ -z "$VERSION" ]; then
            echo "❌ 无法提取版本号"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "提取到的版本号: $VERSION"

          for PLATFORM in x86_64 aarch64_generic aarch64_cortex-a53; do
            makeself "$PLATFORM" "output/25.12-homeproxy-${PLATFORM}-${VERSION}.run" \
              "homeproxy ${PLATFORM} Installer v${VERSION}" ./install.sh
          done

      - name: 获取当天日期 Tag
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: 发布 Release 资产
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build 25.12 - ${{ env.tag_name }}"
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
