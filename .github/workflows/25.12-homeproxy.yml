name: Build 25.12 HomeProxy

on:
  schedule:
    - cron: "0 22 * * *"  # 北京时间早上 6 点
  workflow_dispatch:

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 安装构建依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself curl tar gawk zip unzip python3

      - name: 🚀 从 GitHub 拉取 HomeProxy 源码并打包
        run: |
          TMP_DIR="$(mktemp -d)"
          HOMEPROXY_SRC="${TMP_DIR}/src"

          echo "🔍 正在从 GitHub (immortalwrt/homeproxy) 克隆最新源码..."
          git clone --depth=1 https://github.com/immortalwrt/homeproxy.git "$HOMEPROXY_SRC"

          VERSION="25.12.$(date +'%Y%m%d')"

          # 构建应用根目录结构
          PKG_BUILD="${TMP_DIR}/pkg_build"
          mkdir -p "$PKG_BUILD"

          # 1. 复制应用系统文件到标准 Linux 根目录层级
          if [ -d "${HOMEPROXY_SRC}/root/" ]; then
            cp -rf ${HOMEPROXY_SRC}/root/* "$PKG_BUILD/"
          fi

          if [ -d "${HOMEPROXY_SRC}/htdocs/" ]; then
            mkdir -p "$PKG_BUILD/www/"
            cp -rf ${HOMEPROXY_SRC}/htdocs/* "$PKG_BUILD/www/"
          fi

          # 2. 处理简体中文语言包 (PO -> JSON/LMO 兼容层)
          I18N_DIR="$PKG_BUILD/usr/share/luci/i18n"
          mkdir -p "$I18N_DIR"

          PO_DIR=""
          if [ -d "${HOMEPROXY_SRC}/po/zh_Hans" ]; then
            PO_DIR="${HOMEPROXY_SRC}/po/zh_Hans"
          elif [ -d "${HOMEPROXY_SRC}/po/zh-cn" ]; then
            PO_DIR="${HOMEPROXY_SRC}/po/zh-cn"
          elif [ -d "${HOMEPROXY_SRC}/po/zh_CN" ]; then
            PO_DIR="${HOMEPROXY_SRC}/po/zh_CN"
          fi

          if [ -n "$PO_DIR" ]; then
            echo "🌐 找到简体中文语言目录: $PO_DIR"
            cp -rf "$PO_DIR"/* "$I18N_DIR/" 2>/dev/null || true

            python3 -c "
            import os, json, re
            
            po_dir = '$PO_DIR'
            i18n_out = '$I18N_DIR'
            translations = {}
            
            for root, dirs, files in os.walk(po_dir):
                for f in files:
                    if f.endswith('.po'):
                        filepath = os.path.join(root, f)
                        with open(filepath, 'r', encoding='utf-8', errors='ignore') as pf:
                            content = pf.read()
                            msgids = re.findall(r'msgid \"(.*?)\"\nmsgstr \"(.*?)\"', content, re.DOTALL)
                            for item in msgids:
                                if item[0] and item[1]:
                                    translations[item[0]] = item[1]
            
            if translations:
                with open(os.path.join(i18n_out, 'homeproxy.zh-cn.json'), 'w', encoding='utf-8') as jf:
                    json.dump({'': translations}, jf, ensure_ascii=False, indent=2)
                print('✅ 已生成 homeproxy.zh-cn.json 中文语言文件')
            " || true
          fi

          COMMON_TMP="${TMP_DIR}/common_apks"
          mkdir -p "$COMMON_TMP"

          # 3. 将 HomeProxy 文件打包
          OUT_TGZ="${COMMON_TMP}/luci-app-homeproxy-${VERSION}.tar.gz"
          (cd "$PKG_BUILD" && tar -czf "$OUT_TGZ" .)

          echo "✅ HomeProxy 界面与配置归档文件打包完成！"

          # 4. 抓取 sing-box 依赖包
          PLATFORMS=("x86_64" "aarch64_generic" "aarch64_cortex-a53")

          download_singbox_apk() {
            local arch="$1"
            local save_dir="$2"
            local success=0

            local MIRROR_URLS=(
              "https://downloads.immortalwrt.org/releases/packages-25.12/${arch}/packages"
              "https://downloads.immortalwrt.org/snapshots/packages/${arch}/packages"
              "https://mirrors.cernet.edu.cn/openwrt/releases/25.12.5/packages/${arch}/packages"
            )

            for repo_url in "${MIRROR_URLS[@]}"; do
              echo "🔍 尝试从仓库获取 sing-box: ${repo_url}"
              local hash_id=$(echo -n "$repo_url" | md5sum | awk '{print $1}')
              local index_tar="${TMP_DIR}/APKINDEX_${hash_id}.tar.gz"
              local extract_dir="${TMP_DIR}/ext_${hash_id}"
              mkdir -p "$extract_dir"

              if curl -fsL --connect-timeout 10 "${repo_url}/APKINDEX.tar.gz" -o "$index_tar" 2>/dev/null; then
                tar -zxf "$index_tar" -C "$extract_dir" 2>/dev/null || true
                local index_file=$(ls "$extract_dir"/APKINDEX* 2>/dev/null | head -n 1 || true)

                if [ -n "$index_file" ] && [ -f "$index_file" ]; then
                  local singbox_apk=$(grep -E "^P:sing-box$" -A 10 "$index_file" | grep -E "^V:" | head -n 1 | awk '{print $1}' | sed 's/V://')
                  if [ -n "$singbox_apk" ]; then
                    local target_file="sing-box-${singbox_apk}.apk"
                    echo "⬇️ 找到依赖: ${target_file}，开始下载..."
                    if curl -fsL --connect-timeout 30 "${repo_url}/${target_file}" -o "${save_dir}/${target_file}"; then
                      echo "✅ 依赖 ${target_file} 下载成功！"
                      success=1
                      break
                    fi
                  fi
                fi
              fi
            done

            if [ $success -eq 0 ]; then
              for repo_url in "${MIRROR_URLS[@]}"; do
                local matched_file=$(curl -fsL --connect-timeout 10 "$repo_url/" 2>/dev/null | grep -oE 'sing-box-[0-9][^"]+\.apk' | head -n 1 || true)
                if [ -n "$matched_file" ]; then
                  echo "⬇️ 通过页面正则抓取到依赖: ${matched_file}"
                  if curl -fsL --connect-timeout 30 "${repo_url}/${matched_file}" -o "${save_dir}/${matched_file}"; then
                    success=1
                    break
                  fi
                fi
              done
            fi

            if [ $success -eq 0 ]; then
              echo "❌ 严重错误: 无法为架构 ${arch} 下载 sing-box 依赖！"
              return 1
            fi
          }

          for platform in "${PLATFORMS[@]}"; do
            echo "=========================================="
            echo "📦 正在生成架构包目录: ${platform}"
            echo "=========================================="

            SAVE_DIR="$(pwd)/${platform}"
            mkdir -p "$SAVE_DIR"

            # 复制 HomeProxy 资源归档包
            cp -f "$COMMON_TMP"/*.tar.gz "$SAVE_DIR/"

            # 抓取 sing-box 依赖 (apk)
            download_singbox_apk "$platform" "$SAVE_DIR"

            # 体积校验
            DIR_SIZE_KB=$(du -sk "$SAVE_DIR" | awk '{print $1}')
            echo "📊 架构目录 ${platform} 当前体积: ${DIR_SIZE_KB} KB"
            if [ "$DIR_SIZE_KB" -lt 5000 ]; then
              echo "❌ 校验失败：架构 ${platform} 缺少 sing-box 核心包！"
              exit 1
            fi

            # 5. 生成安装脚本 (采用无语法风险的单引号及转义处理)
            INSTALL_SCRIPT="${SAVE_DIR}/install.sh"
            {
              echo '#!/bin/sh'
              echo 'set -e'
              echo 'echo "🚀 开始安装 HomeProxy 及其依赖..."'
              echo ''
              echo 'SINGBOX_FILE=$(ls sing-box-*.apk 2>/dev/null | head -n 1 || true)'
              echo 'if [ -n "$SINGBOX_FILE" ]; then'
              echo '    echo "📦 正在安装本地依赖包: $SINGBOX_FILE"'
              echo '    apk add --allow-untrusted "$SINGBOX_FILE" || apk add "$SINGBOX_FILE"'
              echo 'else'
              echo '    echo "⚠️ 未在本地找到 sing-box.apk，尝试在线安装..."'
              echo '    apk add sing-box || true'
              echo 'fi'
              echo ''
              echo 'HP_TGZ=$(ls luci-app-homeproxy-*.tar.gz 2>/dev/null | head -n 1 || true)'
              echo 'if [ -n "$HP_TGZ" ]; then'
              echo '    echo "📂 正在解压并部署 HomeProxy 文件到系统..."'
              echo '    tar -zxf "$HP_TGZ" -C /'
              echo '    mkdir -p /usr/share/luci/acl.d/'
              echo '    echo '\''{"luci-app-homeproxy":{"description":"Grant access to HomeProxy","read":{"ubus":{"homeproxy":["*"]},"uci":["homeproxy"]},"write":{"uci":["homeproxy"]}}}'\'' > /usr/share/luci/acl.d/luci-app-homeproxy.json'
              echo '    if [ -f /etc/init.d/homeproxy ]; then'
              echo '        chmod +x /etc/init.d/homeproxy'
              echo '        /etc/init.d/homeproxy enable 2>/dev/null || true'
              echo '    fi'
              echo '    echo "✅ HomeProxy 安装完成！不影响当前后台登录，请手动刷新页面。"'
              echo 'else'
              echo '    echo "❌ 找不到 HomeProxy 资源文件！"'
              echo '    exit 1'
              echo 'fi'
            } > "$INSTALL_SCRIPT"

            chmod +x "$INSTALL_SCRIPT"
          done

          rm -rf "$TMP_DIR"
          echo "✅ 所有架构打包完成！"

      - name: 🔍 提取版本号并打包
        id: pack
        run: |
          mkdir -p output

          APP_TGZ=""
          for PLAT in x86_64 aarch64_generic aarch64_cortex-a53; do
            MATCH=$(ls ${PLAT}/luci-app-homeproxy-*.tar.gz 2>/dev/null | head -n 1 || true)
            if [ -n "$MATCH" ]; then
              APP_TGZ="$MATCH"
              break
            fi
          done

          if [ -z "$APP_TGZ" ]; then
            echo "❌ 未找到构建的资源文件！"
            ls -R
            exit 1
          fi

          VERSION=$(basename "$APP_TGZ" | sed -n 's/^luci-app-homeproxy-\(.*\)\.tar\.gz$/\1/p')

          if [ -z "$VERSION" ]; then
            VERSION="$(date +'%Y%m%d')"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "提取到的版本号: $VERSION"

          for PLATFORM in x86_64 aarch64_generic aarch64_cortex-a53; do
            makeself "$PLATFORM" "output/25.12-homeproxy-${PLATFORM}-${VERSION}.run" \
              "homeproxy ${PLATFORM} Installer v${VERSION}" ./install.sh
          done

      - name: 获取当天日期 Tag
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: 发布 Release 资产
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build 25.12 - ${{ env.tag_name }}"
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
