name: Build 25.12 HomeProxy

on:
  schedule:
    - cron: "0 22 * * *"  # 北京时间早上 6 点
  workflow_dispatch:

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 安装构建依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself curl tar gawk zip unzip

      - name: 🚀 从 GitHub 拉取 HomeProxy 源码并打成标准 APK 包
        run: |
          TMP_DIR="$(mktemp -d)"
          HOMEPROXY_SRC="${TMP_DIR}/src"

          echo "🔍 正在从 GitHub (immortalwrt/homeproxy) 克隆最新源码..."
          git clone --depth=1 https://github.com/immortalwrt/homeproxy.git "$HOMEPROXY_SRC"

          VERSION="25.12.$(date +'%Y%m%d')"

          # 构建 OpenWrt / Alpine 标准 APK 文件目录结构
          PKG_BUILD="${TMP_DIR}/pkg_build"
          mkdir -p "$PKG_BUILD"

          # 1. 复制应用系统文件
          if [ -d "${HOMEPROXY_SRC}/root/" ]; then
            cp -rf ${HOMEPROXY_SRC}/root/* "$PKG_BUILD/"
          fi

          if [ -d "${HOMEPROXY_SRC}/htdocs/" ]; then
            mkdir -p "$PKG_BUILD/www/"
            cp -rf ${HOMEPROXY_SRC}/htdocs/* "$PKG_BUILD/www/"
          fi

          # 2. 生成标准的 .PKGINFO 控制文件（替代传统 control）
          cat << EOF > "$PKG_BUILD/.PKGINFO"
          pkgname = luci-app-homeproxy
          pkgver = ${VERSION}
          pkgdesc = LuCI support for HomeProxy
          url = https://github.com/immortalwrt/homeproxy
          builddate = $(date +%s)
          packager = ImmortalWrt
          size = $(du -sb "$PKG_BUILD" | awk '{print $1}')
          arch = all
          depend = sing-box
          EOF

          COMMON_TMP="${TMP_DIR}/common_apks"
          mkdir -p "$COMMON_TMP"

          # 3. 按照 OpenWrt APK v2 规范生成标准的 apk 包格式
          OUT_APK="${COMMON_TMP}/luci-app-homeproxy-${VERSION}.apk"

          # 打包控制数据段
          (cd "$PKG_BUILD" && tar -czf "${TMP_DIR}/control.tar.gz" .PKGINFO)

          # 打包应用文件数据段
          (cd "$PKG_BUILD" && rm -f .PKGINFO && tar -czf "${TMP_DIR}/data.tar.gz" .)

          # 组合为 Alpine/OpenWrt 标准的 v2 包容器
          tar -cf "$OUT_APK" -C "$TMP_DIR" control.tar.gz data.tar.gz

          echo "✅ HomeProxy 标准 APK 文件构建完成！"

          # 4. 分平台抓取 sing-box 依赖
          MIRROR_BASE_URLS=(
            "https://downloads.immortalwrt.org/releases/packages-25.12"
            "https://downloads.immortalwrt.org/snapshots/packages"
          )

          PLATFORMS=("x86_64" "aarch64_generic" "aarch64_cortex-a53")

          download_singbox_apk() {
            local arch="$1"
            local save_dir="$2"

            for base in "${MIRROR_BASE_URLS[@]}"; do
              local repo_url="${base}/${arch}/packages"
              local hash_id=$(echo -n "$repo_url" | md5sum | awk '{print $1}')
              local index_tar="${TMP_DIR}/APKINDEX_${hash_id}.tar.gz"
              local extract_dir="${TMP_DIR}/ext_${hash_id}"
              mkdir -p "$extract_dir"

              if curl -fsL --connect-timeout 10 "${repo_url}/APKINDEX.tar.gz" -o "$index_tar" 2>/dev/null; then
                if tar -zxf "$index_tar" -C "$extract_dir" 2>/dev/null; then
                  local index_file=""
                  if [ -f "$extract_dir/APKINDEX.unsigned" ]; then
                    index_file="$extract_dir/APKINDEX.unsigned"
                  elif [ -f "$extract_dir/APKINDEX" ]; then
                    index_file="$extract_dir/APKINDEX"
                  fi

                  if [ -n "$index_file" ]; then
                    local ver
                    ver=$(grep -A 5 -E "^P:[ \t]*sing-box$" "$index_file" | grep -E "^V:" | head -n 1 | sed -E 's/^V:[ \t]*//' | tr -d '\r')
                    if [ -n "$ver" ]; then
                      local file_name="sing-box-${ver}.apk"
                      echo "⬇️ 找到 sing-box 依赖: ${file_name}，正在下载..."
                      if curl -fsL --connect-timeout 20 "${repo_url}/${file_name}" -o "${save_dir}/${file_name}"; then
                        break
                      fi
                    fi
                  fi
                fi
              fi
            done
          }

          for platform in "${PLATFORMS[@]}"; do
            echo "=========================================="
            echo "📦 正在生成架构包目录: ${platform}"
            echo "=========================================="

            SAVE_DIR="$(pwd)/${platform}"
            mkdir -p "$SAVE_DIR"

            # 复制生成的 luci-app-homeproxy 包
            cp -f "$COMMON_TMP"/*.apk "$SAVE_DIR/"

            # 尝试抓取对应架构的 sing-box 依赖包
            download_singbox_apk "$platform" "$SAVE_DIR"

            # 写入自动安装脚本
            printf '#!/bin/sh\nset -e\necho "🚀 开始安装 HomeProxy (APK 格式)..."\napk update || true\napk add --allow-untrusted *.apk\necho "✅ HomeProxy 安装成功！"\n' > "${SAVE_DIR}/install.sh"
            chmod +x "${SAVE_DIR}/install.sh"
          done

          rm -rf "$TMP_DIR"
          echo "✅ 成功从 GitHub 源码与依赖生成所有架构包！"

      - name: 🔍 提取版本号并打包
        id: pack
        run: |
          mkdir -p output

          APP_APK=""
          for PLAT in x86_64 aarch64_generic aarch64_cortex-a53; do
            MATCH=$(ls ${PLAT}/luci-app-homeproxy-*.apk 2>/dev/null | head -n 1 || true)
            if [ -n "$MATCH" ]; then
              APP_APK="$MATCH"
              break
            fi
          done

          if [ -z "$APP_APK" ]; then
            echo "❌ 未找到构建的 apk 文件！"
            ls -R
            exit 1
          fi

          VERSION=$(basename "$APP_APK" | sed -n 's/^luci-app-homeproxy-\(.*\)\.apk$/\1/p')

          if [ -z "$VERSION" ]; then
            VERSION="$(date +'%Y%m%d')"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "提取到的版本号: $VERSION"

          for PLATFORM in x86_64 aarch64_generic aarch64_cortex-a53; do
            makeself "$PLATFORM" "output/25.12-homeproxy-${PLATFORM}-${VERSION}.run" \
              "homeproxy ${PLATFORM} Installer v${VERSION}" ./install.sh
          done

      - name: 获取当天日期 Tag
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: 发布 Release 资产
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build 25.12 - ${{ env.tag_name }}"
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
